name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install uv && uv pip install --system -r requirements.txt 2>/dev/null || true
      - run: python -m py_compile $(find . -name "*.py" | head -20) && echo "Syntax OK"
