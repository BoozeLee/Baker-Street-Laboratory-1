version: '3.8'

services:

   # ─── BSL Core API ─────────────────────────────────────────────────────
   bsl-api:
     build:
       context: .
       dockerfile: Dockerfile.api
     container_name: bsl-api
     command: ["python3", "api/app.py"]
     ports:
       - "5000:5000"
     volumes:
       - ./operating_system:/app/operating_system:ro
       - ./research:/app/research
       - ./data:/app/data
       - ./config:/app/config:ro
     environment:
       - PYTHONUNBUFFERED=1
       - OPENAI_API_KEY=${OPENAI_API_KEY}
       - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
       - OLLAMA_HOST=http://ollama:11434
       - FLASK_ENV=development
     depends_on:
       - ollama
       - qdrant
     healthcheck:
       test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/system/status"]
       interval: 30s
       timeout: 10s
       retries: 3
     networks:
       - bsl-network

   # ─── Brain Agent Orchestrator ──────────────────────────────────────────
   brain:
     build:
       context: .
       dockerfile: Dockerfile.brain
     container_name: bsl-brain
     ports:
       - "30000:30000"
     volumes:
       - ./operating_system:/app/operating_system:ro
       - ./data:/app/data
       - ./brain/dist:/app/brain/dist:ro
     environment:
       - NODE_ENV=production
       - BRAIN_PORT=30000
       - BSL_API_URL=http://bsl-api:5000
       - BSL_API_KEY=bsl-local-dev-key
       - OPENAI_API_KEY=${OPENAI_API_KEY}
       - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
       - OLLAMA_HOST=http://ollama:11434
       - NATS_URL=nats://nats:4222
       - QDRANT_URL=http://qdrant:6333
       - SQLITE_PATH=/app/data/bakerst.db
       - CONFIG_PATH=/app/operating_system
     depends_on:
       bsl-api:
         condition: service_healthy
       nats:
         condition: service_started
       qdrant:
         condition: service_started
     healthcheck:
       test: ["CMD", "curl", "-f", "http://localhost:30000/health"]
       interval: 30s
       timeout: 10s
       retries: 3
     networks:
       - bsl-network

   # ─── Gateway (multi-channel: web, telegram, discord) ───────────────────
   gateway:
     build:
       context: .
       dockerfile: Dockerfile.gateway
     container_name: bsl-gateway
     ports:
       - "8080:8080"
     volumes:
       - ./gateway/dist:/app/gateway/dist:ro
     environment:
       - BRAIN_URL=http://brain:30000
       - GATEWAY_PORT=8080
       - BSL_API_URL=http://bsl-api:5000
     depends_on:
       brain:
         condition: service_healthy
     networks:
       - bsl-network

   # ─── Worker Pool (async job execution) ────────────────────────────────
   worker:
     build:
       context: .
       dockerfile: Dockerfile.worker
     container_name: bsl-worker
     volumes:
       - ./worker/dist:/app/worker/dist:ro
     environment:
       - BRAIN_URL=http://brain:30000
       - NATS_URL=nats://nats:4222
       - BSL_API_URL=http://bsl-api:5000
       - WORKER_PORT=30001
     depends_on:
       - nats
       - brain
     networks:
       - bsl-network
     deploy:
       replicas: 2

   # ─── NATS JetStream (message bus) ─────────────────────────────────────
   nats:
     image: nats:2.10-alpine
     container_name: bsl-nats
     ports:
       - "4222:4222"
       - "8222:8222"
     command: ["nats-server", "-js", "-m", "8222"]
     volumes:
       - nats-data:/data
       - nats-config:/etc/nats
     healthcheck:
       test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/"]
       interval: 30s
       timeout: 5s
       retries: 3
     networks:
       - bsl-network

   # ─── Qdrant (vector store / memory) ──────────────────────────────────
   qdrant:
     image: qdrant/qdrant:v1.11.0
     container_name: bsl-qdrant
     ports:
       - "6333:6333"
       - "6334:6334"
     volumes:
       - qdrant-data:/qdrant/storage
     environment:
       - QDRANT__SERVICE__HTTP_PORT=6333
     healthcheck:
       test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:6333/health"]
       interval: 30s
       timeout: 5s
       retries: 3
     networks:
       - bsl-network

   # ─── Ollama (local LLM provider) ─────────────────────────────────────
   ollama:
     image: ollama/ollama:latest
     container_name: bsl-ollama
     ports:
       - "11434:11434"
     volumes:
       - ollama:/root/.ollama
     environment:
       - OLLAMA_KEEP_ALIVE=24h
       - OLLAMA_NUM_GPU=999
     deploy:
       resources:
         reservations:
           devices:
             - driver: nvidia
               count: all
               capabilities: [gpu]
     networks:
       - bsl-network

   # ─── Prometheus & Grafana (optional profile) ─────────────────────────
   prometheus:
     image: prom/prometheus:latest
     container_name: bsl-prometheus
     ports:
       - "9090:9090"
     volumes:
       - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
       - prom-data:/prometheus
     command:
       - '--config.file=/etc/prometheus/prometheus.yml'
       - '--storage.tsdb.path=/prometheus'
     networks:
       - bsl-network
     profiles:
       - monitoring

   grafana:
     image: grafana/grafana:latest
     container_name: bsl-grafana
     ports:
       - "3001:3000"
     volumes:
       - grafana-data:/var/lib/grafana
     depends_on:
       - prometheus
     networks:
       - bsl-network
     profiles:
       - monitoring

networks:
  bsl-network:
    driver: bridge

volumes:
  nats-data:
  nats-config:
  qdrant-data:
  ollama:
  prom-data:
  grafana-data:
