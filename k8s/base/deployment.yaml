apiVersion: apps/v1
kind: Deployment
metadata:
  name: bsl-api
  namespace: bakerst
  labels:
    app: bsl-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bsl-api
  template:
    metadata:
      labels:
        app: bsl-api
    spec:
      containers:
        - name: api
          image: bsl-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FLASK_ENV
              value: "production"
          envFrom:
            - secretRef:
                name: bsl-api-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: bsl-data
              mountPath: /app/data
            - name: research
              mountPath: /app/research
          livenessProbe:
            httpGet:
              path: /api/v1/system/status
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/system/status
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: bsl-data
          persistentVolumeClaim:
            claimName: bsl-data-pvc
        - name: research
          emptyDir: {}
